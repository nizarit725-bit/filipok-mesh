<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Л. Н. Толстой «Филипок». Проверь себя</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#FFF7E6;color:#2B2B2B}
header{background:linear-gradient(90deg,#E8572A,#F4A21B);color:#fff;padding:14px 22px}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 0;font-size:16px;opacity:.95}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.start{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.start img{width:100%;max-width:420px;border-radius:14px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font-size:18px;font-weight:bold;cursor:pointer;margin:6px 6px 0 0}
.b1{background:#1E88E5;color:#fff}.b2{background:#2E9E5B;color:#fff}.b3{background:#8E44AD;color:#fff}.b4{background:#eee;color:#333}
.q{font-size:22px;font-weight:bold;margin:6px 0 14px}
.ans{display:block;width:100%;text-align:left;font-size:19px;padding:12px 16px;margin:8px 0;border-radius:12px;border:2px solid #E0D6C2;background:#FFFDF8;cursor:pointer}
.ans:hover{border-color:#F4A21B}
.ok{background:#DFF5E3!important;border-color:#2E9E5B!important}
.bad{background:#FDE2DE!important;border-color:#E8572A!important}
.fb{font-size:18px;margin-top:10px;padding:10px 14px;border-radius:10px;background:#FFF1C9}
.bar{height:10px;background:#F1E6D0;border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar div{height:100%;background:#2E9E5B;width:0}
.items{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.item{padding:10px 14px;border-radius:12px;background:#E3F2FD;border:2px solid #90CAF9;font-size:18px;cursor:pointer}
.item.sel{background:#FFE082;border-color:#F4A21B}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grp{min-height:90px;border-radius:14px;border:2px dashed #B39DDB;background:#F5F0FF;padding:8px;cursor:pointer}
.grp h3{margin:0 0 6px;font-size:18px;color:#5E35B1}
.grp .put{font-size:15px;padding:6px 8px;margin:4px 0;border-radius:8px;background:#fff}
.small{font-size:15px;color:#666}
</style></head>

function quiz(i,score){
 var Q=D.quiz;
 if(i>=Q.length){
  app.innerHTML='';
  var msg=score>=9?'Отлично! Ты внимательный читатель.':(score>=6?'Хорошо! Перечитай места, где были ошибки.':'Перечитай рассказ и попробуй ещё раз.');
  app.appendChild(el('<div class="card"><p class="q">Результат: '+score+' из '+Q.length+'.</p><p style="font-size:19px">'+msg+'</p><button class="btn b1" id="r">Пройти ещё раз</button><button class="btn b3" id="n">Задание 2</button><button class="btn b4" id="h">В начало</button></div>'));
  document.getElementById('r').onclick=function(){quiz(0,0)};document.getElementById('n').onclick=sortTask;document.getElementById('h').onclick=home;return;
 }
 var q=Q[i];app.innerHTML='';
 var c=el('<div class="card"><div class="bar"><div style="width:'+(i/Q.length*100)+'%"></div></div><p class="small">Вопрос '+(i+1)+' из '+Q.length+'</p><p class="q"></p><div id="as"></div><div id="f"></div></div>');
 c.querySelector('.q').textContent=q.q;app.appendChild(c);
 var as=c.querySelector('#as'),done=false;
 q.a.forEach(function(t,k){var b=document.createElement('button');b.className='ans';b.textContent=t;
  b.onclick=function(){if(done)return;done=true;var right=(k===q.c);if(right)score++;
   b.classList.add(right?'ok':'bad');as.children[q.c].classList.add('ok');
   var f=c.querySelector('#f');f.innerHTML='<div class="fb"></div><button class="btn b2" id="nx">Дальше</button>';
   f.querySelector('.fb').textContent=(right?'Верно! ':'Неверно. ')+q.fb;
   document.getElementById('nx').onclick=function(){quiz(i+1,score)};};
  as.appendChild(b);});
}
function sortTask(){
 var S=D.sort,sel=null,placed=0,errors=0;app.innerHTML='';
 var c=el('<div class="card"><p class="q">Кто это сказал? Нажми на слова, а потом на героя.</p><div class="items" id="it"></div><div class="groups" id="gr"></div><div id="f"></div></div>');
 app.appendChild(c);var it=c.querySelector('#it'),gr=c.querySelector('#gr');
 var order=S.items.map(function(x,i){return i}).sort(function(){return Math.random()-.5});
 order.forEach(function(i){var b=document.createElement('div');b.className='item';b.textContent=S.items[i][0];b.dataset.g=S.items[i][1];
  b.onclick=function(){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');};it.appendChild(b);});
 S.groups.forEach(function(g,gi){var box=el('<div class="grp"><h3></h3></div>');box.querySelector('h3').textContent=g;
  box.onclick=function(){if(!sel)return;var f=c.querySelector('#f');
   if(+sel.dataset.g===gi){var p=document.createElement('div');p.className='put';p.textContent=sel.textContent;box.appendChild(p);sel.remove();sel=null;placed++;f.innerHTML='';
    if(placed===S.items.length){f.innerHTML='<div class="fb"></div><button class="btn b1" id="h">В начало</button>';f.querySelector('.fb').textContent='Готово! Ошибок: '+errors+'. Теперь прочитайте этот разговор по ролям.';document.getElementById('h').onclick=home;}}
   else{errors++;f.innerHTML='<div class="fb">Подумай ещё. Найди эти слова в тексте и посмотри, кто их говорит.</div>';}};
  gr.appendChild(box);});
}
home();
</script></body></html>
